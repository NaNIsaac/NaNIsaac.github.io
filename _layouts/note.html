---
layout: base
---
<article class="note">
  <p class="mono note-meta"><a href="/notes/">← NOTES</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>{% for tag in page.tags %} · {{ tag | upcase }}{% endfor %}</p>
  <h1>{{ page.title | escape }}</h1>
  <div class="prose">{{ content }}</div>
  <p class="mono note-edit"><a href="https://github.com/SJB7777/SJB7777.github.io/edit/master/{{ page.path }}" target="_blank" rel="noopener noreferrer">EDIT ON GITHUB ↗</a></p>
</article>
