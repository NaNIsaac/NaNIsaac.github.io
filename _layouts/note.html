---
layout: base
---
<article class="note">
  <p class="note-meta"><a href="/notes/">Notes</a>, <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% for tag in page.tags %}, {{ tag }}{% endfor %}</p>
  <h1>{{ page.title | escape }}</h1>
  <div class="prose">{{ content }}</div>
  <p class="note-edit"><a href="https://github.com/NaNIsaac/NaNIsaac.github.io/edit/master/{{ page.path }}" target="_blank" rel="noopener noreferrer">Edit this note on GitHub</a></p>
</article>
