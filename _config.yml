title: Isaac Yong
description: Notes on X-ray physics, scientific software, and the tools in between.
url: https://nanisaac.github.io
author: Isaac Yong
lang: en
permalink: /notes/:year/:month/:title/
markdown: kramdown
kramdown:
  math_engine: mathjax
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  path: notes/feed.xml
defaults:
  - scope: { path: "", type: posts }
    values: { layout: note }
  # The Search Console ownership file must stay published but is not a page to index.
  - scope: { path: "google7cc93ec66256fd8b.html" }
    values: { sitemap: false }
exclude: [README.md, tests, docs, "*.cjs"]
